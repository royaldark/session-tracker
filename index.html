<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` report
         anything but zero. Without it the layout's safe-area padding is inert,
         and content sits under the home indicator on the device this is for. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Stifinner</title>
    <!--
      Runs BEFORE first paint, which is the whole point: the bundle cannot do
      this, because by the time it loads the page has already painted white
      and you get a flash on the way to dark. At a dim table that is worse
      than having no dark theme.

      It repeats the storage key and the media query from src/lib/theme.ts
      by hand — it has no module system to import them with. Tests assert
      the two spellings match, so the copies cannot drift in silence.
    -->
    <script>
      try {
        var choice = localStorage.getItem("stifinner:theme");
        if (
          choice === "dark" ||
          ((choice === null || choice === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {
        /* Storage blocked. Light is the safe default; the app corrects it. */
      }
    </script>
    <script type="module" crossorigin src="/session-tracker/assets/index-DUXyPGRH.js"></script>
    <link rel="stylesheet" crossorigin href="/session-tracker/assets/index-D4LXKiOd.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
